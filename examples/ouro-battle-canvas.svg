      .gold { fill: #f0b464; }
      .cyan { fill: #8ecae6; }
      .panel { fill: #0b1117; stroke: #465761; stroke-width: 1.4; rx: 10; }
      .stage { fill: url(#terminal); stroke: #70808a; stroke-width: 2; rx: 10; }
      .muted { fill: #65737a; }
