<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ouro Agent Prompt Legend storefront capture</title>
  <desc id="desc">A dark terminal roguelike hero image showing one AI hero, a local judge, and a graphical TUI battle stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="0.52" stop-color="#12161c"/>
      <stop offset="1" stop-color="#21151a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#172028"/>
      <stop offset="1" stop-color="#231c20"/>
    </linearGradient>
    <filter id="soft">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 56px; font-weight: 800; fill: #f3efe5; letter-spacing: 0; }
      .subtitle { font-size: 24px; fill: #d5c6a5; }
      .small { font-size: 18px; fill: #9fb0b8; }
      .label { font-size: 17px; fill: #ffe0a3; font-weight: 700; }
      .line { font-size: 20px; fill: #dde5df; }
      .dim { fill: #718088; }
      .accent { fill: #f2b35f; }
      .green { fill: #91d18b; }
      .red { fill: #e07b73; }
      .blue { fill: #80b7ff; }
      .box { fill: url(#panel); stroke: #465761; stroke-width: 1.5; rx: 14; }
      .thin { stroke: #465761; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="42" y="38" width="1196" height="644" rx="24" fill="#0b1016" stroke="#33414a" stroke-width="2" filter="url(#soft)"/>
  <text x="76" y="102" class="mono title">OURO AGENT</text>
  <text x="79" y="140" class="mono subtitle">Prompt Legend / train one hero Agent, then watch the dungeon answer back</text>
  <text x="79" y="177" class="mono small">CLI roguelike  |  auto-battler  |  prompt-building game  |  mock playable offline</text>
  <rect x="76" y="206" width="218" height="42" rx="8" fill="#26343b" stroke="#5c7077"/>
  <text x="97" y="234" class="mono label">MODEL CHOOSES</text>
  <rect x="314" y="206" width="218" height="42" rx="8" fill="#31242a" stroke="#7a5653"/>
  <text x="339" y="234" class="mono label">LOCAL JUDGE</text>
  <rect x="552" y="206" width="228" height="42" rx="8" fill="#223229" stroke="#537057"/>
  <text x="576" y="234" class="mono label">DAMAGE IS RULED</text>
  <rect x="76" y="278" width="1114" height="390" class="box"/>
  <line x1="430" y1="278" x2="430" y2="668" class="thin"/>
  <line x1="835" y1="278" x2="835" y2="668" class="thin"/>
  <text x="100" y="318" class="mono label">HERO [CNDL] ASTIA</text>
  <text x="462" y="318" class="mono label">THE ECHO ALTAR / COUNTER WINDOW</text>
  <text x="866" y="318" class="mono label">ENEMY [k] ACOLYTE</text>
  <text x="100" y="356" class="mono line">VOX seal the chant</text>
  <text x="100" y="392" class="mono line">   .^.</text>
  <text x="100" y="424" class="mono line">  /|c|==*</text>
  <text x="100" y="456" class="mono line">   / \</text>
  <text x="100" y="502" class="mono line">HP ████████ 100/100</text>
  <text x="100" y="534" class="mono line">MP █████░░░ 54/72</text>
  <text x="100" y="566" class="mono green">BUILD [ONLINE] shadow/control</text>
  <text x="462" y="360" class="mono blue">SELECT  &gt;  WINDOW  &gt;  JUDGE</text>
  <text x="462" y="404" class="mono accent">        SEAL -16 HP</text>
  <text x="462" y="448" class="mono line">░░░▒▒▓▓████▓▓▒▒░░░</text>
  <text x="462" y="502" class="mono line">ACTION HEX -&gt; k</text>
  <text x="462" y="534" class="mono line">JUDGE  VALID | -16 HP</text>
  <text x="462" y="566" class="mono small">Echo Cost 0 tokens / Ritual Time 12ms</text>
  <text x="866" y="356" class="mono line">ENM the wick counts down</text>
  <text x="866" y="392" class="mono line">    ~(k*)~</text>
  <text x="866" y="424" class="mono line">     /|w|\</text>
  <text x="866" y="456" class="mono line">     / \</text>
  <text x="866" y="502" class="mono red">HP ████░░░░ 34/70</text>
  <text x="866" y="534" class="mono line">ATB ██████ charge 1/1</text>
  <text x="866" y="566" class="mono accent">FX SLN1 / INTENT SILENCED</text>
  <rect x="100" y="604" width="1018" height="38" rx="8" fill="#111a20" stroke="#465761"/>
  <text x="124" y="629" class="mono small">FIRST RULE: the model selects structured actions; the deterministic local engine resolves every hit, status, reward, and defeat.</text>
</svg>
