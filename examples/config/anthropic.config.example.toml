# Ouro Agent example config: Anthropic Messages API.
# This file MUST NOT contain plaintext API keys.
# api_key_env stores the NAME of an environment variable, never the key.

[ouro_agent]
provider = "anthropic"
model = "claude-sonnet-4-5"
api_key_env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
api_version = "2023-06-01"
timeout_seconds = 30
max_retries = 1
trace_level = "L0"
unicode_mode = false
language = "zh"
