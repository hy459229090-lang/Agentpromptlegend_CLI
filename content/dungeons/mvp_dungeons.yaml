schema_version: "0.1"
content_version: "mvp_a"
dungeons:
  - id: dungeon_ember_crypt
    display_name:
      en: "Ember Crypt"
      zh: "灰烬墓室"
    description:
      en: "The archive opens under a field of dead candles. Every chant you interrupt becomes a line in the Codex."
      zh: "档案在一片死烛下打开。你打断的每一次吟唱，都会成为图鉴中的一行。"
    scene_text:
      en: "ash candles flicker under a broken arch"
      zh: "断裂拱门下，灰烬烛火摇曳"
    floors:
      - floor_number: 1
        display_name:
          en: "Entrance Hall"
          zh: "入口大厅"
        nodes:
          - node_ember_crypt_f1_n1
        is_start: true
      - floor_number: 2
        display_name:
          en: "Candle Gallery"
          zh: "烛火长廊"
        nodes:
          - node_ember_crypt_f2_n1
          - node_ember_crypt_f2_n2
          - node_ember_crypt_f2_n3
        route_choice: true
      - floor_number: 3
        display_name:
          en: "Chamber of Echoes"
          zh: "回响之室"
        nodes:
          - node_ember_crypt_f3_n1
          - node_ember_crypt_f3_n2
        route_choice: true
      - floor_number: 4
        display_name:
          en: "Black Chapel"
          zh: "黑烛礼拜堂"
        nodes:
          - node_ember_crypt_f4_boss
        is_boss_floor: true

nodes:
  - id: node_ember_crypt_f1_n1
    node_type: normal_combat
    display_name:
      en: "Hungry Followers"
      zh: "饥饿信徒"
    description:
      en: "A small group of hungry cultists patrols the entrance."
      zh: "一小群饥饿的邪教徒在入口巡逻。"
    enemy_ids:
      - enemy_hungry_cultist
    rewards:
      gold: 15
      xp: 10
      reward_choices:
        - type: item
          item_id: item_cracked_wand
        - type: affix
          affix_id: affix_corrupted_focus
        - type: codex
          progress: 1

  - id: node_ember_crypt_f2_n1
    node_type: normal_combat
    display_name:
      en: "[M] Hungry Followers"
      zh: "[M] 饥饿信徒"
    description:
      en: "More cultists, slightly stronger. Risk: low. Reward: gold/xp."
      zh: "更多邪教徒，稍强一些。风险：低。奖励：金币/经验。"
    enemy_ids:
      - enemy_hungry_cultist
      - enemy_hungry_cultist
    rewards:
      gold: 25
      xp: 20
      reward_choices:
        - type: item
          item_id: item_warden_aegis
        - type: affix
          affix_id: affix_ember_thorn
        - type: codex
          progress: 1
    risk_level: low

  - id: node_ember_crypt_f2_n2
    node_type: shop
    display_name:
      en: "[$] Black Candle Merchant"
      zh: "[$] 黑烛商人"
    description:
      en: "A mysterious merchant selling candles and trinkets. Risk: safe. Reward: shop, no xp."
      zh: "一个神秘商人，出售蜡烛和饰品。风险：安全。奖励：商店，无经验。"
    shop_items:
      - type: item
        item_id: item_quick_string
        price: 18
      - type: affix
        affix_id: affix_candle_smoke
        price: 14
      - type: strategy
        strategy_style: control
        price: 10
    risk_level: safe

  - id: node_ember_crypt_f3_boss
    node_type: boss
    display_name:
      en: "[B] Black Candle High Priest"
      zh: "[B] 黑烛主祭"
    description:
      en: "The leader of the black candle cult, already reading your last three turns."
      zh: "黑烛教派的领袖，已经读过你最近的三个回合。"
    enemy_ids:
      - enemy_black_candle_acolyte
      - enemy_hungry_cultist
    rewards:
      gold: 50
      xp: 40
      reward_choices:
        - type: item
          item_id: item_black_sun_codex
        - type: affix
          affix_id: affix_iron_will
        - type: codex
          progress: 2
    is_boss: true

  - id: node_ember_crypt_f2_n3
    node_type: rest
    display_name:
      en: "[+] Candle Shrine"
      zh: "[+] 烛火圣坛"
    description:
      en: "A small shrine with flickering candles. Rest here to recover HP and MP. Risk: safe."
      zh: "一个烛火摇曳的小圣坛。在此休息可恢复HP和MP。风险：安全。"
    risk_level: safe

  - id: node_ember_crypt_f3_n1
    node_type: normal_combat
    display_name:
      en: "[M] Candle Acolytes"
      zh: "[M] 烛火侍僧"
    description:
      en: "Two acolytes guarding the inner sanctum. Risk: medium."
      zh: "两名守护内殿的侍僧。风险：中。"
    enemy_ids:
      - enemy_black_candle_acolyte
      - enemy_black_candle_acolyte
    rewards:
      gold: 30
      xp: 25
      reward_choices:
        - type: item
          item_id: item_warden_aegis
        - type: affix
          affix_id: affix_ember_thorn
        - type: codex
          progress: 1
    risk_level: medium

  - id: node_ember_crypt_f3_n2
    node_type: event
    display_name:
      en: "[?] Mysterious Altar"
      zh: "[?] 神秘祭坛"
    description:
      en: "A strange altar with three glowing symbols. Choose wisely."
      zh: "一个刻有三个发光符号的神秘祭坛。明智选择。"
    rewards:
      reward_choices:
        - type: item
          item_id: item_quick_string
        - type: gold
          gold: 50
        - type: heal
          heal_percent: 50
    risk_level: safe

  - id: node_ember_crypt_f4_boss
    node_type: boss
    display_name:
      en: "[B] Black Candle High Priest"
      zh: "[B] 黑烛主祭"
    description:
      en: "The leader of the black candle cult, already reading your last three turns."
      zh: "黑烛教派的领袖，已经读过你最近的三个回合。"
    enemy_ids:
      - enemy_black_candle_acolyte
      - enemy_hungry_cultist
    rewards:
      gold: 50
      xp: 40
      reward_choices:
        - type: item
          item_id: item_black_sun_codex
        - type: affix
          affix_id: affix_iron_will
        - type: codex
          progress: 2
    is_boss: true
