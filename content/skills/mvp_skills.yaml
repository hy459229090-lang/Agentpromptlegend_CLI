schema_version: "0.1"
content_version: "mvp_a"
skills:
  # --- Astia (Shadow Apprentice) ---
  - id: skill_shadow_sting
    display_name:
      en: Shadow Sting
      zh: 暗影刺
    mp_cost: 12
    cooldown: 2
    target_rule: single_enemy
    tags: [shadow, damage]
    effect:
      kind: damage
      base: 18
      power_scale: 1.0
      damage_type: shadow
      apply_status:
        id: status_corruption
        stacks: 1
        duration: 3
    visible_description:
      en: >-
        Pierce a single foe with a candle-fed shadow lance, inflicting corruption.
      zh: >-
        引动黑烛之力刺穿单个敌人，附加腐化层数。
  - id: skill_hex_seal
    display_name:
      en: Hex Seal
      zh: 禁咒封印
    mp_cost: 18
    cooldown: 4
    target_rule: single_enemy
    tags: [shadow, control]
    effect:
      kind: status
      apply_status:
        id: status_silence
        stacks: 1
        duration: 2
      base: 6
      power_scale: 0.4
      damage_type: shadow
    visible_description:
      en: >-
        Brand a foe with a silencing sigil, slowing their next action and
        dealing minor shadow damage.
      zh: >-
        在敌人身上烙下沉默符印，延滞其下一动作并造成少量暗影伤害。
  - id: skill_corrupted_focus
    display_name:
      en: Corrupted Focus
      zh: 腐化凝神
    mp_cost: 0
    cooldown: 3
    target_rule: self
    tags: [shadow, buff]
    effect:
      kind: status
      apply_status:
        id: status_shield
        stacks: 8
        duration: 3
      base: 0
      power_scale: 0
      damage_type: none
    visible_description:
      en: >-
        Channel candle smoke into a thin shadow shield around yourself.
      zh: >-
        将烛烟凝成一层薄薄的暗影护盾。

  # --- Norn (Ash Guardian) ---
  - id: skill_tower_brace
