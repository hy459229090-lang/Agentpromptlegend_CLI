      kind: damage
      base: 22
      power_scale: 0.8
      damage_type: fire
    visible_description:
      en: >-
        A heavy retaliatory strike, especially effective against charging foes.
      zh: >-
        一记沉重的反击，对正在蓄力的敌人尤为有效。
  - id: skill_ash_glare
    display_name:
      en: Ash Glare
      zh: 灰烬瞪视
    mp_cost: 8
    cooldown: 3
    target_rule: single_enemy
    tags: [guard, control]
    effect:
