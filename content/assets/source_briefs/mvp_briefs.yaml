schema_version: "0.1"
content_version: "mvp_cinematic_assets"
brief_families:
  - id: hero_actor_sheet
    source_types: [hero]
    output: transparent PNG sprite sheet, 96x96 or 128x128 cells
    prompt: "Dark terminal roguelike hero actor sheet, Black Candle silhouette language, readable at low resolution, stable anchor, idle/ready/attack/skill/guard/hit/low HP/victory/defeat poses, no text."
    negative_prompt: "no letters, no logo, no UI text, no brand replica, no photoreal person, no busy background, no cropped limbs, no unrelated props"
    terminal_target: "10x6 Unicode fallback cells and bitmap stage actor column"
    qa_checks: [transparent_background, stable_anchor, pose_delta, terminal_legible, mit_safe]
  - id: enemy_actor_sheet
    source_types: [enemy]
    output: transparent PNG sprite sheet, 96x96 cells; boss may use 192x128
    prompt: "Dark terminal roguelike enemy actor sheet, family/tier silhouette, idle/telegraph/attack-or-cast/hit/break/death/codex reveal poses, strong readable outline, no text."
    negative_prompt: "no letters, no logo, no UI text, no brand replica, no photoreal gore, no busy background, no unrelated props"
    terminal_target: "10x6 Unicode fallback cells and right-side enemy actor column"
    qa_checks: [transparent_background, silhouette_readable, tier_variant, pose_delta, mit_safe]
  - id: skill_effect_sheet
    source_types: [skill]
    output: transparent PNG effect sheet, 160x64 or 192x64
    prompt: "Low-resolution spell or weapon effect sheet for terminal combat, spawn/travel/near-hit/impact/dissolve frames, visible trail, hit-stop shape change, no text."
    negative_prompt: "no arrows made of text, no letters, no logo, no UI frame, no brand replica, no busy background"
    terminal_target: "center effect lane with Unicode cell fallback"
    qa_checks: [transparent_background, frame_delta, lane_readable, hit_stop_visible, mit_safe]
  - id: item_icon_card
    source_types: [item]
    output: transparent PNG icon and compact card crop, 64x64
    prompt: "Dark terminal roguelike item icon and reward card motif, readable object silhouette, compact shape, strong value contrast, no text."
    negative_prompt: "no written labels, no logo, no brand replica, no realistic product pack, no busy background"
    terminal_target: "reward/shop/build card and small HUD mark"
    qa_checks: [silhouette_readable, card_crop_safe, terminal_legible, mit_safe]
  - id: affix_badge_card
    source_types: [affix]
    output: transparent PNG badge and reward-card motif, 48x48
    prompt: "Small dark fantasy affix badge for terminal build UI, one clear motif, readable at icon size, no text."
    negative_prompt: "no letters, no logo, no brand replica, no full character, no busy background"
    terminal_target: "Build badge, reward card, online state chip"
    qa_checks: [icon_readable, badge_shape_stable, terminal_legible, mit_safe]
  - id: resonance_badge_card
    source_types: [resonance]
    output: transparent PNG badge and online/high-roll motif, 48x48
    prompt: "Resonance build badge for dark terminal roguelike, stronger than affix badge, readable motif, online and high-roll state variants, no text."
    negative_prompt: "no letters, no logo, no brand replica, no full character, no busy background"
    terminal_target: "Build online/high roll badge and reward card motif"
    qa_checks: [icon_readable, state_variant, terminal_legible, mit_safe]
  - id: stage_plate
    source_types: [dungeon, node_type]
    output: low-density PNG stage plate, 320x160 or 480x240
    prompt: "Dark terminal roguelike stage plate, low-density background texture, clear floor mood, leaves empty left/right actor columns and center effect lane, no text."
    negative_prompt: "no letters, no logo, no UI text, no photoreal venue, no dense clutter, no brand replica"
    terminal_target: "combat intro plate, route/shop/rest/event/boss scene background"
    qa_checks: [low_density, stage_readable, actor_space_clear, mit_safe]
  - id: hud_sprite
    source_types: [ui_state]
    output: transparent PNG HUD sprite, compact variants
    prompt: "Terminal roguelike HUD sprite, compact bar or pop effect, readable at tiny size, high contrast, no text except values rendered by engine."
    negative_prompt: "no labels, no logo, no brand replica, no full UI mockup, no busy background"
    terminal_target: "HP/MP/ATB bars, damage pop, combat HUD"
    qa_checks: [tiny_readable, value_overlay_safe, terminal_legible, mit_safe]
  - id: status_badge_sprite
    source_types: [ui_state]
    output: transparent PNG status badge variants, 32x32
    prompt: "Small status badge for terminal combat, single visual motif for applied/ticking/expire states, readable without text."
    negative_prompt: "no written abbreviations, no logo, no brand replica, no busy background"
    terminal_target: "status chip beside actor and Unicode fallback glyph"
    qa_checks: [badge_readable, state_variant, terminal_legible, mit_safe]
  - id: codex_reward_sprite
    source_types: [ui_state]
    output: transparent PNG card/reveal sprite variants
    prompt: "Dark terminal roguelike codex or reward card reveal sprite, locked/fog/reveal/learned or seed/pair/online/high/lock states, no text."
    negative_prompt: "no letters, no logo, no brand replica, no full menu screenshot, no busy background"
    terminal_target: "codex reveal, reward card, Build state badge"
    qa_checks: [state_variant, card_crop_safe, terminal_legible, mit_safe]
