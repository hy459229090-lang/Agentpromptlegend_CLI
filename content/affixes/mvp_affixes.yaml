schema_version: "0.1"
content_version: "mvp_a"
affixes:
  - id: affix_corrupted_focus
    display_name:
      en: Corrupted Focus
      zh: 腐化凝神
    tags: [shadow, corruption]
    stat_mods:
      power: 3
    description:
      en: Channels corruption inward. Trades clarity for raw power.
      zh: 把腐化向内引导，以理智换取威能。

  - id: affix_iron_will
    display_name:
      en: Iron Will
      zh: 铁意
    tags: [guard]
    stat_mods:
      hp: 15
    description:
      en: Refuses to fall on the first blow.
      zh: 拒绝在第一击中倒下。

  - id: affix_quickdraw
    display_name:
      en: Quickdraw
      zh: 速射
    tags: [hunter, speed]
    stat_mods:
      speed: 2
    description:
      en: First shot is the fastest shot.
      zh: 第一发就是最快的一发。

  - id: affix_ember_thorn
    display_name:
      en: Ember Thorn
      zh: 余烬棘刺
    tags: [retribution, guard]
    stat_mods:
      defense: 2
    description:
      en: Hot embers cling to the shield. Attackers feel them.
      zh: 余烬粘在盾面，攻击者会被其灼伤。

  - id: affix_silent_step
    display_name:
      en: Silent Step
      zh: 静默步
    tags: [hunter, stealth]
    stat_mods:
      defense: 2
      speed: 1
    description:
      en: Footfalls hidden in candle smoke.
      zh: 足音消散在烛烟之中。

  - id: affix_candle_smoke
    display_name:
      en: Candle Smoke
      zh: 烛烟笼罩
    tags: [shadow, control]
    stat_mods:
      mp: 6
      defense: 1
    description:
      en: A thin pall of smoke trails behind every gesture.
      zh: 一缕薄烟跟随每一次手势漂动。

  - id: affix_mire_touch
    display_name:
      en: Mire Touch
      zh: 沼触
    tags: [poison, attrition]
    stat_mods:
      power: 3
      mp: 4
    description:
      en: Every gesture leaves a trace of toxic mist.
      zh: 每一个手势都留下毒雾痕迹。

  - id: affix_omen_sense
    display_name:
      en: Omen Sense
      zh: 预兆感知
    tags: [omen, control]
    stat_mods:
      speed: 2
      defense: 1
    description:
      en: Senses incoming threats before they fully manifest.
      zh: 在威胁完全显现前感知到它们。

  - id: affix_trap_sense
    display_name:
      en: Trap Sense
      zh: 陷阱感知
    tags: [trap, gear]
    stat_mods:
      attack: 3
      defense: 1
    description:
      en: Every mechanical trigger feels like an extension of the body.
      zh: 每一个机关扳机都像是身体的延伸。

  - id: affix_ignition_ward
    display_name:
      en: Ignition Ward
      zh: 燃点护符
    tags: [fire, gear]
    stat_mods:
      power: 3
      attack: 2
    description:
      en: Gears run hot enough to ignite nearby flammables.
      zh: 齿轮运转时温度高到能点燃附近可燃物。

  - id: affix_echo_resonance
    display_name:
      en: Echo Resonance
      zh: 回声共鸣
    tags: [echo, holy]
    stat_mods:
      power: 3
      mp: 5
    description:
      en: Even the faintest sound returns amplified.
      zh: 即使最微弱的声音也会被放大返回。

  - id: affix_cleansing_tone
    display_name:
      en: Cleansing Tone
      zh: 净化音
    tags: [cleanse, holy]
    stat_mods:
      defense: 2
      mp: 3
    description:
      en: A pure tone that burns away corruption.
      zh: 燃烧腐化的纯净音调。
