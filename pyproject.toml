[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouro-agent"
version = "0.1.0"
description = "Agent Prompt Legend CLI: a command-line AI roguelike."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ouro Agent Contributors" }]
license = { text = "MIT" }
keywords = ["cli", "roguelike", "ai", "llm", "ascii"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
ouro = "ouro_agent.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ouro_agent" = ["py.typed"]

[tool.setuptools.data-files]
"share/ouro-agent/content/heroes" = ["content/heroes/mvp_heroes.yaml"]
"share/ouro-agent/content/skills" = ["content/skills/mvp_skills.yaml"]
"share/ouro-agent/content/enemies" = ["content/enemies/mvp_enemies.yaml"]
"share/ouro-agent/content/items" = ["content/items/mvp_items.yaml"]
"share/ouro-agent/content/affixes" = ["content/affixes/mvp_affixes.yaml"]
"share/ouro-agent/content/resonances" = ["content/resonances/mvp_resonances.yaml"]
"share/ouro-agent/content/dungeons" = ["content/dungeons/mvp_dungeons.yaml"]
"share/ouro-agent/content/assets" = [
    "content/assets/README.md",
    "content/assets/_rules.md",
    "content/assets/manifest.yaml",
]
"share/ouro-agent/content/assets/source_briefs" = [
    "content/assets/source_briefs/README.md",
    "content/assets/source_briefs/_rules.md",
    "content/assets/source_briefs/mvp_briefs.yaml",
]
"share/ouro-agent/content/assets/qa" = [
    "content/assets/qa/README.md",
    "content/assets/qa/_rules.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
